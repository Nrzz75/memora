<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover : utilise tout l'écran des iPhone à encoche -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Mémora</title>
  <meta name="description" content="Cartes de révision avec répétition espacée et IA intégrée">

  <!-- Couleur de la barre du téléphone (claire / sombre) -->
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#111114" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">

  <!-- PWA : installation sur l'écran d'accueil -->
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="icons/icon-192.png" type="image/png" sizes="192x192">
  <!-- iPhone -->
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Mémora">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="app" aria-live="polite">
    <div class="page center"><span class="spinner big"></span></div>
  </main>
  <nav id="tabs" class="tabs" aria-label="Navigation principale"></nav>

  <noscript>Cette application a besoin de JavaScript.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
